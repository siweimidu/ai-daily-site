# Hugo 配置
title: AI 洞察日报
timezone: Asia/Shanghai
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
hasCJKLanguage: true
enableInlineShortcodes: true

outputs:
  home: [html]
  page: [html]
  section: [html, rss]

# Hextra 主题
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - identifier: documentation
      name: AI 日报
      pageRef: /
      weight: 1
    - identifier: search
      name: 搜索
      weight: 2
      params:
        type: search

params:
  description: 每日自动聚合 AI 领域动态，涵盖前沿论文、开源项目与行业新闻，AI 生成中文摘要。
  descriptionEn: Daily AI news, papers and open-source projects, summarized by AI.

  author:
    name: "AI 洞察日报"

  displayUpdatedDate: false
  dateFormat: "2006/01/02"

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

  # 显式关闭上游默认内置的第三方统计与广告
  adsenseId: ""
  umamiKey: ""
  clarityID: ""

  editURL:
    enable: false

  blog:
    list:
      displayTags: false

  search:
    enable: true
    type: flexsearch

  theme:
    default: system
    displayToggle: true
